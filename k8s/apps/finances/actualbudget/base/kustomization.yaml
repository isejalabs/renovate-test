apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# only default namespace is supported by this helm chart, so we do not specify it
namespace: actualbudget

resources:
  - ns.yaml
  - helmrepository.yaml
  - helmrepository ns_.yaml
  - helmrelease.yaml
  - helmrelease full.yaml
  - helmrelease full+ns_.yaml
  - http-route.yaml
